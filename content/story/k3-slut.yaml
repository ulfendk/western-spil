# End of chapter 3.
id: k3-slut
lines:
  - id: forter
    speaker: kanel
    text: Nu ved alle forter besked om Bøvl-brødrene. Men de ved stadig ikke, hvor naglen er.
    say: Nu ved alle forter besked om Bøvl-brødrene. Men de ved stadig ikke hvor naglen er.
  - id: bjerge
    speaker: fortaeller
    text: Mod vest rejser bjergene sig. Klippebjergene venter på Kanel og grønskollingen.
  - id: bakke
    speaker: kanel
    text: Bjerge. Det betyder op ad bakke. Hele vejen. Jeg håber, du har havre med.
    say: Bjerge. Det betyder op ad bakke. Hele vejen. Jeg håber du har havre med.
