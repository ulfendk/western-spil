# Kapitel 5 – Klippebjergene. Arriving in the mountains.
id: k5-intro
lines:
  - id: bjerge
    speaker: fortaeller
    text: >-
      Sporet snor sig op i Klippebjergene. Luften bliver kold, og der ligger sne på
      toppene.
  - id: bakke
    speaker: kanel
    text: Op ad bakke. Hele tiden op ad bakke. Jeg sagde det jo.
  - id: by
    speaker: fortaeller
    text: Nede i kløften ligger minebyen Sølvkløften. Røgen stiger op fra skorstenene.
