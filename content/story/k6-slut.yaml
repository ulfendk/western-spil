# Epilogue at sunset.
id: k6-slut
lines:
  - id: groen
    speaker: kanel
    text: Nå, grønskolling. Du er vist ikke så grøn mere.
    say: Nå grønskolling. Du er vist ikke så grøn mere.
  - id: solen
    speaker: kanel
    text: Solen går ned i vest, og vi rider ind i den. Sådan slutter alle gode historier.
  - id: anden
    speaker: fortaeller
    text: Og Kanel og hans ven red ud i solnedgangen. Men det er en helt anden historie.
