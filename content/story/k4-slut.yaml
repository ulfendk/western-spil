# Farewell the next morning.
id: k4-slut
lines:
  - id: gave
    speaker: wanbli
    text: >-
      Jeg har lavet noget til dig. Et armbånd med perler. Så husker du os, når du er langt
      mod vest.
    say: >-
      Jeg har lavet noget til dig. Et armbånd med perler. Så husker du os når du er langt mod
      vest.
  - id: tak
    speaker: mato
    text: God rejse, lille ven. Pas på din hest. Han taler meget, men han har et godt hjerte.
  - id: hjerte
    speaker: kanel
    text: Endelig en, der forstår mig.
    say: Endelig en der forstår mig.
  - id: bjergene
    speaker: fortaeller
    text: Med armbåndet om håndleddet rider du videre. Nu venter Klippebjergene.
