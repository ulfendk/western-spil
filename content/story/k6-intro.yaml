# Kapitel 6 – Promontory. The finale in the Utah desert.
id: k6-intro
lines:
  - id: dato
    speaker: fortaeller
    text: >-
      Det er den tiende maj 1869. I ørkenen i Utah skal de to jernbaner mødes ved Promontory.
  - id: varmt
    speaker: kanel
    text: Varmt. Støvet. Og ingen havre. Men sikke en dag.
