# After three good bison photos.
id: k2-foto-klar
lines:
  - id: flotte
    speaker: sofie
    text: Hvor er de flotte! Tusind tak for billederne.
  - id: millioner
    speaker: fortaeller
    text: >-
      Engang levede der millioner af bisoner på prærien. De oprindelige folk levede af bisonen
      og brugte hver en del af den.
  - id: floden
    speaker: jensen
    text: Nu kører vi mod floden. Den er svær at komme over med en tung vogn.
  - id: tomme
    speaker: kanel
    text: Floden Platte. Man siger, den er en kilometer bred og kun en tomme dyb.
